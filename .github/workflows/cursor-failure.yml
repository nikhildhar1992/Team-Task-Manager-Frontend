name: Cursor Failure Automation

on:
  push:
    branches:
      - frontend-core-saas-16b6   # change if your branch is different

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      # 👇 INTENTIONALLY FAIL (for testing)
      - name: Force failure
        run: |
          echo "Forcing failure..."
          exit 1

  report-to-cursor:
    runs-on: ubuntu-latest
    needs: [build]
    if: failure()

    steps:
      - name: Send failure to Cursor
        run: |
          echo "Triggering Cursor webhook"
          echo "Run ID: ${{ github.run_id }}"
          echo "Repo ID: ${{ github.repository_id }}"

          curl -v -X POST -H "Content-Type: application/json" \
          -d "{\"pipeline_id\": \"${{ github.run_id }}\", \"project_id\": \"${{ github.repository_id }}\"}" \
          https://api2.cursor.sh/automations/webhook/6a146950-3a47-44cd-970b-98f2e6658cfe