name: Auth Pages CI/CD

on:
  pull_request:
    paths:
      - 'app/src/features/auth/LoginPage.tsx'
      - 'app/src/features/auth/SignupPage.tsx'
      - 'app/src/features/auth/validation.js'
      - 'app/src/features/auth/validation.test.js'
      - 'app/eslint.config.js'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/auth-pages-ci-cd.yml'
  push:
    paths:
      - 'app/src/features/auth/LoginPage.tsx'
      - 'app/src/features/auth/SignupPage.tsx'
      - 'app/src/features/auth/validation.js'
      - 'app/src/features/auth/validation.test.js'
      - 'app/eslint.config.js'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/auth-pages-ci-cd.yml'

jobs:
  auth-pages-ci:
    name: Lint login/signup pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run auth validation tests
        run: npm test

      - name: Run targeted auth page lint checks
        run: npx eslint src/features/auth/LoginPage.tsx src/features/auth/SignupPage.tsx

  auth-pages-cd:
    name: Publish auth page artifact
    needs: auth-pages-ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload login/signup artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-pages-${{ github.sha }}
          path: |
            app/src/features/auth/LoginPage.tsx
            app/src/features/auth/SignupPage.tsx
          if-no-files-found: error

report-to-cursor:
  runs-on: ubuntu-latest
  needs: [auth-pages-ci]   # 👈 use your actual job name
  if: failure()

  steps:
    - name: Send failure to Cursor
      run: |
        echo "Triggering Cursor webhook"
        echo "Run ID: ${{ github.run_id }}"
        echo "Repo ID: ${{ github.repository_id }}"

        curl -v -X POST -H "Content-Type: application/json" \
        -d "{\"pipeline_id\": \"${{ github.run_id }}\", \"project_id\": \"${{ github.repository_id }}\"}" \
        https://api2.cursor.sh/automations/webhook/6a146950-3a47-44cd-970b-98f2e6658cfe